; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
framework = arduino

; Каталоги заголовков. Исходники разложены по подпапкам src/ (config, core, hal,
; ui, apps, games), поэтому каждую добавляем в путь поиска — тогда прежние
; `#include <foo.h>` продолжают работать независимо от расположения файла.
build_flags =
    -I src
    -I src/config
    -I src/core
    -I src/hal
    -I src/ui
    -I src/apps
    -I src/games

; Внешние библиотеки. Точные версии зафиксированы копиями в lib/ (они и есть
; «пиннинг»): ArduinoJson 7.0.3, EncButton 3.5.2, NimBLE 1.4.1 и т.д. Не указывайте
; здесь версии из реестра — иначе PlatformIO скачает более новую (напр. ArduinoJson
; 7.4.x) и она перекроет вендоренную, что ломает совместимость API.
lib_deps =
    ArduinoJson
    EncButton
    ESP32 BLE Keyboard
    GyverIO
    GyverOLED
    NimBLE-Arduino
    rcswitch
    SmartRC-CC1101-Driver-Lib

[env:esp32dev]
board = esp32dev
monitor_speed = 115200
upload_speed = 921600
